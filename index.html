<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raoufi — Réservez votre @nom</title>
<meta name="description" content="Raoufi — le portefeuille algérien pour envoyer de l'argent en une seconde. Réservez votre @nom avant le lancement.">
<meta name="theme-color" content="#04120B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --black:#04120B;
  --mint:#6EE7A0;
  --mint-2:#34D399;
  --red:#D21034;
  --fg:#EAF3ED;
  --dim:#9DB3A6;
  --faint:rgba(234,243,237,.12);
  --card:rgba(255,255,255,.035);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;
  background:var(--black);color:var(--fg);
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;position:relative;
}
body[dir="rtl"]{font-family:"Tajawal","Poppins",system-ui,sans-serif}

/* dark green ombré at the top, fading to black */
.bg,.grid{position:absolute;inset:0 0 auto 0;height:1100px;z-index:0;pointer-events:none}
.bg{
  background:
    radial-gradient(120% 62% at 50% -8%, rgba(47,107,62,.62) 0%, rgba(11,58,34,.36) 38%, rgba(4,18,11,0) 74%),
    linear-gradient(180deg,#0A2C1B 0%,#061B10 32%,var(--black) 62%);
}
.grid{
  opacity:.5;
  background-image:
    linear-gradient(rgba(110,231,160,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(110,231,160,.055) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(80% 46% at 50% 8%,#000 0%,transparent 76%);
  -webkit-mask-image:radial-gradient(80% 46% at 50% 8%,#000 0%,transparent 76%);
}
.page{position:relative;z-index:1}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px clamp(16px,4vw,32px);
  background:rgba(4,18,11,.82);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid rgba(234,243,237,.08);
}
.tabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-inline:auto}
.tabs a{
  color:var(--dim);font-size:13.5px;font-weight:500;
  padding:8px 13px;border-radius:999px;text-decoration:none;white-space:nowrap;
}
.tabs a:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.tabs a[aria-current="page"]{color:var(--mint);background:rgba(110,231,160,.09)}
.brand{display:flex;align-items:center;gap:13px;min-width:0}

.brand .nm{font-weight:700;font-size:16px;letter-spacing:.01em;line-height:1.2}
.brand .nm i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin-inline-start:3px}
.brand .sub{
  font-size:10.5px;letter-spacing:.16em;color:var(--dim);
  text-transform:uppercase;font-weight:500;margin-top:3px;
}
body[dir="rtl"] .brand .sub{letter-spacing:0;text-transform:none;font-size:12px}

.hgroup{display:flex;align-items:center;gap:10px}
.badge{
  font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mint);border:1px solid rgba(110,231,160,.3);
  background:rgba(110,231,160,.06);border-radius:999px;padding:9px 16px;white-space:nowrap;
}
body[dir="rtl"] .badge{letter-spacing:0;text-transform:none}
.langs{display:flex;gap:2px;border:1px solid var(--faint);border-radius:999px;padding:3px}
.langs button{
  font:inherit;font-size:11.5px;font-weight:600;color:var(--dim);
  background:none;border:0;border-radius:999px;padding:6px 10px;cursor:pointer;
}
.langs button[aria-pressed="true"]{background:rgba(255,255,255,.1);color:var(--fg)}
.langs button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

/* ---------- hero ---------- */
.hero{
  max-width:940px;margin:0 auto;
  padding:clamp(40px,8vw,84px) clamp(18px,5vw,32px) clamp(60px,10vw,110px);
  text-align:center;
}
.pill{
  display:inline-flex;align-items:center;gap:9px;
  border:1px solid var(--faint);background:rgba(255,255,255,.04);
  border-radius:999px;padding:9px 20px;
  font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--fg);margin-bottom:clamp(26px,6vw,44px);
}
body[dir="rtl"] .pill{letter-spacing:0;text-transform:none;font-size:13.5px}
.pill .dot{
  width:7px;height:7px;border-radius:50%;background:var(--mint);flex:none;
  animation:ping 2.4s ease-out infinite;
}
@keyframes ping{
  0%{box-shadow:0 0 0 0 rgba(110,231,160,.5)}
  70%,100%{box-shadow:0 0 0 9px rgba(110,231,160,0)}
}

h1{
  font-size:clamp(38px,8.4vw,86px);
  line-height:1.02;letter-spacing:-.045em;font-weight:800;
  margin:0 0 clamp(20px,4vw,30px);
}
body[dir="rtl"] h1{letter-spacing:0;line-height:1.26}
h1 .grad{
  background:linear-gradient(95deg,var(--mint) 0%,var(--mint-2) 42%,#3FA9E0 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  display:inline-block;padding-bottom:.07em;
}
.lede{
  font-size:clamp(14.5px,2.1vw,17px);line-height:1.75;color:var(--dim);
  max-width:620px;margin:0 auto clamp(34px,7vw,54px);font-weight:400;
}

.count{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:clamp(8px,1.6vw,14px);max-width:620px;margin:0 auto;
}
.cell{
  background:var(--card);border:1px solid var(--faint);
  border-radius:16px;padding:clamp(16px,3.2vw,26px) 6px;
}
.cell .v{
  font-size:clamp(26px,6.4vw,46px);font-weight:700;letter-spacing:-.03em;
  line-height:1;font-variant-numeric:tabular-nums;
}
.cell .k{
  font-size:clamp(8.5px,1.5vw,10.5px);letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-top:9px;font-weight:500;
}
body[dir="rtl"] .cell .k{letter-spacing:0;text-transform:none;font-size:clamp(10.5px,1.8vw,12.5px)}

/* ---------- form ---------- */
form{margin:14px auto 0;max-width:520px}
.field{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.05);border:1px solid var(--faint);
  border-radius:16px;padding:7px 7px 7px 20px;
}
body[dir="rtl"] .field{padding:7px 20px 7px 7px}
.field:focus-within{border-color:rgba(110,231,160,.45)}
.field input{

var lang="fr";
var form=document.getElementById("form"),
    msgEl=document.getElementById("msg"),
    doneEl=document.getElementById("done");

function apply(l){
  lang=l;var t=T[l];
  document.documentElement.lang=l;
  document.body.dir=t.dir;
  document.querySelectorAll("[data-t]").forEach(function(el){
    el.textContent=t[el.getAttribute("data-t")];
  });
  document.querySelectorAll("[data-ph]").forEach(function(el){
    el.placeholder=t[el.getAttribute("data-ph")];
  });
  document.querySelectorAll("[data-al]").forEach(function(el){
    el.setAttribute("aria-label",t[el.getAttribute("data-al")]);
  });
  if(typeof refreshTagHint==="function")refreshTagHint();
  document.querySelectorAll(".langs button").forEach(function(b){
    b.setAttribute("aria-pressed",String(b.dataset.lang===l));
  });
  try{localStorage.setItem("raoufi-lang",l);}catch(e){}
  if(typeof setupDownloads==="function"&&document.getElementById("dl-ios"))setupDownloads();
}
document.querySelectorAll(".langs button").forEach(function(b){
  b.addEventListener("click",function(){apply(b.dataset.lang);});
});
(function(){
  var saved=null;try{saved=localStorage.getItem("raoufi-lang");}catch(e){}
  var nav=(navigator.language||"fr").slice(0,2);
  apply(saved||(T[nav]?nav:"fr"));
})();

/* download buttons */
var platform = (function(){
  var ua = navigator.userAgent || "";
  if (/android/i.test(ua)) return "android";
  if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) return "ios";
  return null;
})();
function setupDownloads(){
  var t = T[lang];
  var ios = document.getElementById("dl-ios"), and = document.getElementById("dl-android");
  ios.href = IOS_URL; and.href = ANDROID_URL;
  ios.classList.toggle("suggested", platform === "ios");
  and.classList.toggle("suggested", platform === "android");
  var hint = document.getElementById("dl-hint");
  hint.textContent = platform === "ios" ? t.dlHintIos
                   : platform === "android" ? t.dlHintAndroid
                   : t.dlHintIos + " " + t.dlHintAndroid;
}

setupDownloads();

/* countdown */
(function(){
  var target=new Date(LAUNCH_DATE).getTime();
  var els={d:document.getElementById("d"),h:document.getElementById("h"),
           m:document.getElementById("m"),s:document.getElementById("s")};
  function pad(n){return n<10?"0"+n:""+n;}
  function tick(){
    if(isNaN(target)){document.getElementById("count").hidden=true;return;}
    var diff=target-Date.now();if(diff<0)diff=0;
    var sec=Math.floor(diff/1000);
    els.d.textContent=pad(Math.floor(sec/86400));
    els.h.textContent=pad(Math.floor(sec%86400/3600));
    els.m.textContent=pad(Math.floor(sec%3600/60));
    els.s.textContent=pad(sec%60);
  }
  tick();setInterval(tick,1000);
})();

/* signup count */
/* New publishable keys (sb_publishable_...) go in "apikey" only;
   old anon keys (eyJ...) also need the Authorization header. */
function sbHeaders(){
  var h={"apikey":SUPABASE_ANON,"Content-Type":"application/json"};
  if(/^eyJ/.test(SUPABASE_ANON))h["Authorization"]="Bearer "+SUPABASE_ANON;
  return h;
}
function loadCount(){
  fetch(SUPABASE_URL+"/rest/v1/rpc/waitlist_count",{
    method:"POST",
    headers:sbHeaders(),
    body:"{}"
  }).then(function(r){return r.ok?r.json():Promise.reject();})
    .then(function(n){
      if(typeof n!=="number"||n<SHOW_COUNT_FROM)return;
      document.getElementById("signups").hidden=false;
      document.getElementById("signupCount").textContent=n.toLocaleString(lang==="ar"?"fr":lang);
    }).catch(function(){});
}
loadCount();

/* @tag reservation */
var tagEl=document.getElementById("tag"),
    tagField=document.querySelector(".tagfield"),
    tagState=document.getElementById("tagstate"),
    tagHint=document.getElementById("taghint");
var TAG_RE=/^[a-z][a-z0-9_.]{2,19}$/;
var tagStatus="empty", tagTimer=null, tagReq=0;

function rpc(name,body){
  return fetch(SUPABASE_URL+"/rest/v1/rpc/"+name,{
    method:"POST",
    headers:sbHeaders(),
    body:JSON.stringify(body)
  }).then(function(r){return r.ok?r.json():Promise.reject(new Error(r.status));});
}
function cleanTag(v){return (v||"").toLowerCase().replace(/^@+/,"").replace(/[^a-z0-9_.]/g,"").slice(0,20);}
function localTagProblem(t){
  if(!t)return "empty";
  if(!/^[a-z]/.test(t)||t.length<3)return "short";
  if(!TAG_RE.test(t)||/[._]{2}/.test(t)||/[._]$/.test(t))return "chars";
  return null;
}
function setTagUI(status){
  tagStatus=status;var t=T[lang],tag=tagEl.value;
  tagField.classList.toggle("ok",status==="ok");
  tagField.classList.toggle("bad",status==="taken"||status==="short"||status==="chars");
  tagState.className="tagstate"+(status==="ok"?" ok":status==="busy"?" busy":(status==="taken"||status==="short"||status==="chars")?" bad":"");
  tagState.textContent=status==="ok"?"✓":(status==="taken"||status==="short"||status==="chars")?"✕":"";
  var msg="",cls="taghint";
  if(status==="ok"){msg=t.tagOk.replace("{tag}",tag);cls+=" ok";}
  else if(status==="taken"){msg=t.tagTaken.replace("{tag}",tag);cls+=" bad";}
  else if(status==="short"){msg=t.tagShort;cls+=" bad";}
  else if(status==="chars"){msg=t.tagChars;cls+=" bad";}
  else if(status==="busy"){msg=t.tagChecking;}
  tagHint.className=cls;tagHint.textContent=msg;
}
function refreshTagHint(){ if(tagEl)setTagUI(tagStatus); }
function checkTag(){
  var v=cleanTag(tagEl.value);
  if(v!==tagEl.value)tagEl.value=v;
  clearTimeout(tagTimer);
  var p=localTagProblem(v);
  if(p==="empty"){setTagUI("empty");return;}
  if(p){setTagUI(p);return;}
  setTagUI("busy");
  var my=++tagReq;
  tagTimer=setTimeout(function(){
    rpc("tag_available",{p_tag:v}).then(function(ok){
      if(my!==tagReq)return;
      setTagUI(ok===true?"ok":"taken");
    }).catch(function(){ if(my===tagReq)setTagUI("empty"); });
  },420);
}
tagEl.addEventListener("input",checkTag);

function mark(el,bad){el.classList.toggle("bad",!!bad);}
var consentEl=document.getElementById("consent");
consentEl.addEventListener("change",function(){
  form.querySelector("button.submit").disabled=!consentEl.checked;
  consentEl.parentNode.classList.remove("bad");
});

form.addEventListener("submit",function(e){
  e.preventDefault();
  var t=T[lang];
  var tag=cleanTag(tagEl.value),
      nameEl=document.getElementById("name"),
      emailEl=document.getElementById("email"),
      phoneEl=document.getElementById("phone"),
      cc=document.getElementById("cc").value,
      name=nameEl.value.trim().replace(/\s+/g," "),
      email=emailEl.value.trim().toLowerCase(),
      phone=phoneEl.value.trim(),
      btn=form.querySelector("button.submit");
  msgEl.className="msg";msgEl.textContent="";
  [nameEl,emailEl,phoneEl].forEach(function(x){mark(x,false);});

  if(localTagProblem(tag)||tagStatus==="taken"){
    msgEl.className="msg err";msgEl.textContent=t.errTag;tagEl.focus();return;
  }
  if(name.length<2){mark(nameEl,true);msgEl.className="msg err";msgEl.textContent=t.errName;nameEl.focus();return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){mark(emailEl,true);msgEl.className="msg err";msgEl.textContent=t.errEmail;emailEl.focus();return;}
  if(phone.replace(/\D/g,"").length<8){mark(phoneEl,true);msgEl.className="msg err";msgEl.textContent=t.errPhone;phoneEl.focus();return;}
  if(!consentEl.checked){consentEl.parentNode.classList.add("bad");msgEl.className="msg err";msgEl.textContent=t.errConsent;consentEl.focus();return;}

  btn.disabled=true;msgEl.textContent=t.sending;
  rpc("reserve_tag",{
    p_full_name:name,p_email:email,p_phone:phone,p_tag:tag,
    p_locale:lang,p_source:new URLSearchParams(location.search).get("src")||"site",
    p_country_code:cc,p_consent:true
  }).then(function(res){
    if(res&&res.ok){
      form.hidden=true;
      document.getElementById("doneH").textContent=t.doneHt.replace("{tag}",res.tag);
      document.getElementById("doneNum").textContent="#"+res.founder_number;
      document.getElementById("share").href="https://wa.me/?text="+encodeURIComponent(t.shareMsg);
      doneEl.hidden=false;loadCount();
      document.getElementById("reserve").scrollIntoView({behavior:"smooth",block:"center"});
      return;
    }
    var err=res&&res.error, m=t.errNet;
    if(err==="tag_taken"){setTagUI("taken");m=t.errTag;tagEl.focus();}
    else if(err==="invalid_tag"){setTagUI("chars");m=t.errTag;}
    else if(err==="invalid_name"){mark(nameEl,true);m=t.errName;}
    else if(err==="invalid_email"){mark(emailEl,true);m=t.errEmail;}
    else if(err==="invalid_phone"){mark(phoneEl,true);m=t.errPhone;}
    else if(err==="country_code_mismatch"||err==="invalid_country_code"){mark(phoneEl,true);m=t.errCode;}
    else if(err==="already_reserved"){mark(emailEl,true);m=t.errAlready.replace(" (@{tag})",res.tag?" (@"+res.tag+")":"").replace("{tag}",res.tag||"");}
    else if(err==="phone_used"){mark(phoneEl,true);m=t.errPhoneUsed;phoneEl.focus();}
    msgEl.className="msg err";msgEl.textContent=m;btn.disabled=false;
  }).catch(function(){
    msgEl.className="msg err";msgEl.textContent=t.errNet;btn.disabled=false;
  });
});
