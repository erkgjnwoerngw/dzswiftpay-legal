<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raoufi — Bientôt disponible</title>
<meta name="description" content="Raoufi — le portefeuille algérien pour envoyer de l'argent en une seconde. Rejoignez la liste d'attente de la bêta.">
<meta name="theme-color" content="#04120B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --black:#04120B;
  --green:#2F6B3E;
  --mint:#6EE7A0;
  --mint-2:#34D399;
  --red:#D21034;
  --fg:#EAF3ED;
  --dim:#9DB3A6;
  --faint:rgba(234,243,237,.12);
  --card:rgba(255,255,255,.035);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;
  background:var(--black);color:var(--fg);
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;position:relative;
}
body[dir="rtl"]{font-family:"Tajawal","Poppins",system-ui,sans-serif}

/* dark green ombré fading to black */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(47,107,62,.6) 0%, rgba(11,58,34,.36) 38%, rgba(4,18,11,0) 72%),
    linear-gradient(180deg,#0A2C1B 0%,#061B10 34%,var(--black) 68%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:
    linear-gradient(rgba(110,231,160,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(110,231,160,.055) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(85% 55% at 50% 12%,#000 0%,transparent 78%);
  -webkit-mask-image:radial-gradient(85% 55% at 50% 12%,#000 0%,transparent 78%);
}
.page{position:relative;z-index:1}

header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:22px clamp(18px,5vw,48px);
}

.brand .nm{font-weight:700;font-size:16px;letter-spacing:.01em;line-height:1.2}
.brand .nm i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);margin-inline-start:3px}
.brand .sub{
  font-size:10.5px;letter-spacing:.16em;color:var(--dim);
  text-transform:uppercase;font-weight:500;margin-top:3px;
}
body[dir="rtl"] .brand .sub{letter-spacing:0;text-transform:none;font-size:12px}

.hgroup{display:flex;align-items:center;gap:10px}
.badge{
  font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mint);border:1px solid rgba(110,231,160,.3);
  background:rgba(110,231,160,.06);border-radius:999px;padding:9px 16px;white-space:nowrap;
}
body[dir="rtl"] .badge{letter-spacing:0;text-transform:none}
.langs{display:flex;gap:2px;border:1px solid var(--faint);border-radius:999px;padding:3px}
.langs button{
  font:inherit;font-size:11.5px;font-weight:600;color:var(--dim);
  background:none;border:0;border-radius:999px;padding:6px 10px;cursor:pointer;
}
.langs button[aria-pressed="true"]{background:rgba(255,255,255,.1);color:var(--fg)}
.langs button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

main{
  max-width:940px;margin:0 auto;
  padding:clamp(28px,7vw,70px) clamp(18px,5vw,32px) 80px;
  text-align:center;
}
.pill{
  display:inline-flex;align-items:center;gap:9px;
  border:1px solid var(--faint);background:rgba(255,255,255,.04);
  border-radius:999px;padding:9px 20px;
  font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--fg);margin-bottom:clamp(26px,6vw,44px);
}
body[dir="rtl"] .pill{letter-spacing:0;text-transform:none;font-size:13.5px}
.pill .dot{
  width:7px;height:7px;border-radius:50%;background:var(--mint);flex:none;
  animation:ping 2.4s ease-out infinite;
}
@keyframes ping{
  0%{box-shadow:0 0 0 0 rgba(110,231,160,.5)}
  70%,100%{box-shadow:0 0 0 9px rgba(110,231,160,0)}
}

h1{
  font-size:clamp(38px,8.4vw,86px);
  line-height:1.02;letter-spacing:-.045em;font-weight:800;
  margin:0 0 clamp(20px,4vw,30px);
}
body[dir="rtl"] h1{letter-spacing:0;line-height:1.26}
h1 .grad{
  background:linear-gradient(95deg,var(--mint) 0%,var(--mint-2) 42%,#3FA9E0 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  display:inline-block;padding-bottom:.07em;
}
.lede{
  font-size:clamp(14.5px,2.1vw,17px);line-height:1.75;color:var(--dim);
  max-width:620px;margin:0 auto clamp(34px,7vw,54px);font-weight:400;
}

.count{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:clamp(8px,1.6vw,14px);max-width:620px;margin:0 auto;
}
.cell{
  background:var(--card);border:1px solid var(--faint);
  border-radius:16px;padding:clamp(16px,3.2vw,26px) 6px;
}
.cell .v{
  font-size:clamp(26px,6.4vw,46px);font-weight:700;letter-spacing:-.03em;
  line-height:1;font-variant-numeric:tabular-nums;
}
.cell .k{
  font-size:clamp(8.5px,1.5vw,10.5px);letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-top:9px;font-weight:500;
}
body[dir="rtl"] .cell .k{letter-spacing:0;text-transform:none;font-size:clamp(10.5px,1.8vw,12.5px)}

form{margin:clamp(34px,7vw,54px) auto 0;max-width:520px}
.field{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.05);border:1px solid var(--faint);
  border-radius:16px;padding:7px 7px 7px 20px;
}
body[dir="rtl"] .field{padding:7px 20px 7px 7px}
.field:focus-within{border-color:rgba(110,231,160,.45)}
.field input{
  flex:1;min-width:0;font:inherit;font-size:15px;
  background:none;border:0;color:var(--fg);padding:13px 0;
}
.field input:focus{outline:none}
.field input::placeholder{color:#7C9186}
.field button{
  font:inherit;font-size:14.5px;font-weight:700;flex:none;
  color:#04120B;border:0;border-radius:12px;padding:14px 22px;cursor:pointer;
  background:linear-gradient(95deg,var(--mint) 0%,var(--mint-2) 100%);
}
.field button:hover{filter:brightness(1.07)}
.field button:disabled{opacity:.5;cursor:default}
.field button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}

.phone-row{margin-top:10px}
.phone-row input{
  width:100%;font:inherit;font-size:15px;
  background:rgba(255,255,255,.035);border:1px solid var(--faint);
  border-radius:16px;padding:16px 20px;color:var(--fg);
}
.phone-row input:focus{outline:none;border-color:rgba(110,231,160,.45)}
.phone-row input::placeholder{color:#7C9186}

.reassure{font-size:13px;color:var(--dim);margin:16px 0 0;font-weight:400}
.msg{font-size:13.5px;font-weight:600;margin:12px 0 0;min-height:19px}
.msg.err{color:#FF8A9B}

.done{
  max-width:520px;margin:clamp(34px,7vw,54px) auto 0;
  background:var(--card);border:1px solid rgba(110,231,160,.22);
  border-radius:20px;padding:34px 26px;
}
.done .tick{
  width:54px;height:54px;border-radius:50%;margin:0 auto 16px;
  background:linear-gradient(140deg,var(--mint),var(--mint-2));
  display:grid;place-items:center;
}
.done .tick svg{width:26px;height:26px;stroke:#04120B;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.done h2{font-size:21px;font-weight:700;margin:0 0 9px;letter-spacing:-.02em}
.done p{font-size:14px;color:var(--dim);margin:0;line-height:1.7}
[hidden]{display:none!important}

.signups{margin:clamp(30px,6vw,46px) 0 0;font-size:13.5px;color:var(--dim);font-weight:500}
.signups b{color:var(--mint);font-weight:700;font-variant-numeric:tabular-nums}
.plats{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:26px 0 0}
.plat{
  font-size:12px;font-weight:600;color:var(--dim);
  border:1px solid var(--faint);border-radius:999px;padding:8px 15px;
}
footer{max-width:940px;margin:0 auto;padding:0 clamp(18px,5vw,32px) 54px;text-align:center}
.note{font-size:11.5px;color:#6E8377;line-height:1.75;max-width:560px;margin:0 auto 18px}
footer a{color:var(--dim);font-size:12.5px;text-decoration:none;font-weight:500}
footer a:hover{color:var(--mint)}

@media (prefers-reduced-motion:reduce){.pill .dot{animation:none}}
@media (max-width:540px){
  header{flex-direction:column;align-items:flex-start;gap:14px}
  .hgroup{width:100%;justify-content:space-between}
}
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="brand">
      <div class="ic"></div>
      <div>
        <div class="nm">RAOUFI<i></i></div>
        <div class="sub" data-t="tagline"></div>
      </div>
    </div>
    <div class="hgroup">
      <span class="badge" data-t="badge"></span>
      <nav class="langs" aria-label="Langue">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="ar" aria-pressed="false">ع</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </nav>
    </div>
  </header>

  <main>
    <div class="pill"><span class="dot"></span><span data-t="pill"></span></div>

    <h1><span data-t="h1a"></span> <span class="grad" data-t="h1b"></span> <span data-t="h1c"></span></h1>

    <p class="lede" data-t="lede"></p>

    <div class="count" id="count" role="timer">
      <div class="cell"><div class="v" id="d">00</div><div class="k" data-t="days"></div></div>
      <div class="cell"><div class="v" id="h">00</div><div class="k" data-t="hours"></div></div>
      <div class="cell"><div class="v" id="m">00</div><div class="k" data-t="mins"></div></div>
      <div class="cell"><div class="v" id="s">00</div><div class="k" data-t="secs"></div></div>
    </div>

    <form id="form" novalidate>
      <div class="field">
        <input id="email" type="email" autocomplete="email" required data-ph="emailPh" aria-label="Email">
        <button class="submit" type="submit" data-t="cta"></button>
      </div>
      <div class="phone-row">
        <input id="phone" type="tel" autocomplete="tel" data-ph="phonePh" aria-label="Phone">
      </div>
      <p class="reassure" data-t="reassure"></p>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>

    <div class="done" id="done" hidden>
      <div class="tick"><svg viewBox="0 0 24 24"><path d="M4 12.8 9.2 18 20 6.6"/></svg></div>
      <h2 data-t="doneH"></h2>
      <p data-t="doneP"></p>
    </div>

    <p class="signups" id="signups" hidden><b id="signupCount">0</b> <span data-t="counterLabel"></span></p>

    <div class="plats">
      <span class="plat">iOS · TestFlight</span>
      <span class="plat">Android · APK</span>
    </div>
  </main>

  <footer>
    <p class="note" data-t="note"></p>
    <a href="./index.html" data-t="legal"></a>
  </footer>
</div>

<script>
/* ================================================================
   CONFIG — edit these three lines, nothing else.
   ================================================================ */
var LAUNCH_DATE   = "2026-12-01T09:00:00+01:00";   // countdown target, Algiers time
var SUPABASE_URL  = "https://YOUR-PROJECT.supabase.co";
var SUPABASE_ANON = "YOUR-ANON-KEY";
var SHOW_COUNT_FROM = 250;   // signup counter stays hidden below this

var T = {
  fr:{
    dir:"ltr",
    tagline:"Portefeuille numérique · Algérie",
    badge:"Bêta — 2026",
    pill:"Bientôt disponible",
    h1a:"Envoyez de l'argent", h1b:"en une seconde", h1c:"en Algérie",
    lede:"Raoufi est un portefeuille algérien pour envoyer et recevoir de l'argent instantanément entre utilisateurs, par tag ou par QR code. La bêta est ouverte par invitation.",
    days:"Jours", hours:"Heures", mins:"Minutes", secs:"Secondes",
    emailPh:"Entrez votre email", phonePh:"Téléphone (facultatif)",
    cta:"Être notifié",
    reassure:"Soyez parmi les premiers informés. Aucun spam, promis.",
    counterLabel:"personnes déjà sur la liste",
    doneH:"Vous êtes sur la liste.",
    doneP:"On vous écrit dès qu'une place se libère. Vérifiez vos spams — l'email vient de raoufi.app.",
    note:"Raoufi est en version bêta et n'est pas encore un prestataire de services de paiement agréé par la Banque d'Algérie. Aucun dépôt n'est accepté du grand public pendant cette phase.",
    legal:"Mentions légales et confidentialité",
    errEmail:"Entrez une adresse email valide.",
    errNet:"Échec de l'envoi. Réessayez dans un instant.",
    errDupe:"Cet email est déjà sur la liste.",
    sending:"Envoi…"
  },
  ar:{
    dir:"rtl",
    tagline:"محفظة رقمية · الجزائر",
    badge:"نسخة تجريبية — 2026",
    pill:"قريباً",
    h1a:"صيفط الدراهم", h1b:"في ثانية", h1c:"في الجزائر",
    lede:"راوفي محفظة جزائرية باش تصيفط وتستقبل الدراهم دغيا بين المستعملين، بالتاڤ ولا بكود QR. النسخة التجريبية بالدعوة.",
    days:"يوم", hours:"ساعة", mins:"دقيقة", secs:"ثانية",
    emailPh:"دخّل الإيميل تاعك", phonePh:"رقم الهاتف (اختياري)",
    cta:"علّمني",
    reassure:"كون من الأوائل لي يعلمو. بلا سبام، نوعدك.",
    counterLabel:"واحد راهم في القائمة",
    doneH:"راك في القائمة.",
    doneP:"نكتبولك كي تتفكّ بلاصة. شوف في السبام — الإيميل يجي من raoufi.app.",
    note:"راوفي مازال في نسخة تجريبية وماشي مؤسسة دفع معتمدة من بنك الجزائر. ما نقبلو حتى وديعة من الجمهور في هاد المرحلة.",
    legal:"الشروط القانونية والخصوصية",
    errEmail:"دخّل إيميل صحيح.",
    errNet:"ما تصيفطش. عاود من بعد شوية.",
    errDupe:"هاد الإيميل راه ديجا في القائمة.",
    sending:"جاري الإرسال…"
  },
  en:{
    dir:"ltr",
    tagline:"Digital wallet · Algeria",
    badge:"Beta — 2026",
    pill:"Coming soon",
    h1a:"Send money", h1b:"in one second", h1c:"in Algeria",
    lede:"Raoufi is an Algerian wallet for sending and receiving money instantly between users, by tag or QR code. The beta is invite-only.",
    days:"Days", hours:"Hours", mins:"Minutes", secs:"Seconds",
    emailPh:"Enter your email", phonePh:"Phone (optional)",
    cta:"Notify me",
    reassure:"Be among the first to know. No spam, promise.",
    counterLabel:"people already on the list",
    doneH:"You're on the list.",
    doneP:"We'll email you when a place opens up. Check your spam — the email comes from raoufi.app.",
    note:"Raoufi is in beta and is not yet a payment service provider licensed by the Bank of Algeria. No deposits are accepted from the general public during this phase.",
    legal:"Legal terms and privacy",
    errEmail:"Enter a valid email address.",
    errNet:"Couldn't send that. Try again in a moment.",
    errDupe:"That email is already on the list.",
    sending:"Sending…"
  }
};

var lang="fr";
var form=document.getElementById("form"),
    msgEl=document.getElementById("msg"),
    doneEl=document.getElementById("done");

function apply(l){
  lang=l;var t=T[l];
  document.documentElement.lang=l;
  document.body.dir=t.dir;
  document.querySelectorAll("[data-t]").forEach(function(el){
    el.textContent=t[el.getAttribute("data-t")];
  });
  document.querySelectorAll("[data-ph]").forEach(function(el){
    el.placeholder=t[el.getAttribute("data-ph")];
  });
  document.querySelectorAll(".langs button").forEach(function(b){
    b.setAttribute("aria-pressed",String(b.dataset.lang===l));
  });
  try{localStorage.setItem("raoufi-lang",l);}catch(e){}
}
document.querySelectorAll(".langs button").forEach(function(b){
  b.addEventListener("click",function(){apply(b.dataset.lang);});
});
(function(){
  var saved=null;try{saved=localStorage.getItem("raoufi-lang");}catch(e){}
  var nav=(navigator.language||"fr").slice(0,2);
  apply(saved||(T[nav]?nav:"fr"));
})();

/* countdown */
(function(){
  var target=new Date(LAUNCH_DATE).getTime();
  var els={d:document.getElementById("d"),h:document.getElementById("h"),
           m:document.getElementById("m"),s:document.getElementById("s")};
  function pad(n){return n<10?"0"+n:""+n;}
  function tick(){
    if(isNaN(target)){document.getElementById("count").hidden=true;return;}
    var diff=target-Date.now();if(diff<0)diff=0;
    var sec=Math.floor(diff/1000);
    els.d.textContent=pad(Math.floor(sec/86400));
    els.h.textContent=pad(Math.floor(sec%86400/3600));
    els.m.textContent=pad(Math.floor(sec%3600/60));
    els.s.textContent=pad(sec%60);
  }
  tick();setInterval(tick,1000);
})();

/* signup count */
function loadCount(){
  fetch(SUPABASE_URL+"/rest/v1/rpc/waitlist_count",{
    method:"POST",
    headers:{"apikey":SUPABASE_ANON,"Authorization":"Bearer "+SUPABASE_ANON,"Content-Type":"application/json"},
    body:"{}"
  }).then(function(r){return r.ok?r.json():Promise.reject();})
    .then(function(n){
      if(typeof n!=="number"||n<SHOW_COUNT_FROM)return;
      document.getElementById("signups").hidden=false;
      document.getElementById("signupCount").textContent=n.toLocaleString(lang==="ar"?"fr":lang);
    }).catch(function(){});
}
loadCount();

/* signup */
form.addEventListener("submit",function(e){
  e.preventDefault();
  var t=T[lang];
  var email=document.getElementById("email").value.trim();
  var phone=document.getElementById("phone").value.trim();
  var btn=form.querySelector("button.submit");

  if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){
    msgEl.className="msg err";msgEl.textContent=t.errEmail;return;
  }
  btn.disabled=true;msgEl.className="msg";msgEl.textContent=t.sending;

  fetch(SUPABASE_URL+"/rest/v1/waitlist",{
    method:"POST",
    headers:{"apikey":SUPABASE_ANON,"Authorization":"Bearer "+SUPABASE_ANON,
             "Content-Type":"application/json","Prefer":"return=minimal"},
    body:JSON.stringify({
      email:email.toLowerCase(),phone:phone||null,locale:lang,
      source:new URLSearchParams(location.search).get("src")||"site"
    })
  }).then(function(r){
    if(r.ok){form.hidden=true;doneEl.hidden=false;loadCount();return;}
    if(r.status===409){msgEl.className="msg err";msgEl.textContent=t.errDupe;btn.disabled=false;return;}
    throw new Error(r.status);
  }).catch(function(){
    msgEl.className="msg err";msgEl.textContent=t.errNet;btn.disabled=false;
  });
});
</script>
</body>
</html>
